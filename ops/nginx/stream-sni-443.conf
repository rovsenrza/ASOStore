# :443 SNI split. www.ruappstore.com -> mtg (MTProxy fake-TLS; mtg fronts
# non-Telegram clients back to the site), everything else -> the site.
# Both upstreams get PROXY protocol so the real client IP survives.
map $ssl_preread_server_name $sni_upstream {
    www.ruappstore.com  127.0.0.1:8445;
    default             127.0.0.1:8444;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    ssl_preread on;
    proxy_pass $sni_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
}
