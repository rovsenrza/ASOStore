# :443 SNI split. www.ruappstore.com -> mtg (MTProxy fake-TLS; mtg fronts
# non-Telegram clients back to the site), everything else -> the site.
# Both upstreams get PROXY protocol so the real client IP survives.
# Session log: a session stuck until proxy_timeout (t>=590 s) with modest out= is the RU TSPU
# freeze signature. rport = client source port (tells the arm of a port-parity A/B test).
log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name up=$upstream_addr st=$status in=$bytes_received out=$bytes_sent t=$session_time rport=$remote_port';
access_log /var/log/nginx/stream-443.log sni;

map $ssl_preread_server_name $sni_upstream {
    www.ruappstore.com  127.0.0.1:8445;
    default             127.0.0.1:8444;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    ssl_preread on;
    proxy_pass $sni_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
}
