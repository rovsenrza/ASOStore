# Security headers. Laravel (SecurityHeaders middleware) already sets these on PHP responses,
# and add_header would repeat them, so each value below is empty (= header not sent) whenever
# the upstream sent its own. Static files (front HTML, assets, admin panel) get nginx's.
map $upstream_http_strict_transport_security $sec_hsts {
    ""      "max-age=31536000; includeSubDomains";
    default "";
}
# Public SEO pages deliberately omit X-Frame-Options (their CSP frame-ancestors lets Metrika's
# Webvisor frame them), so none is added when the upstream sent any CSP.
map "$upstream_http_x_frame_options|$upstream_http_content_security_policy$upstream_http_content_security_policy_report_only" $sec_xfo {
    "|"     "SAMEORIGIN";
    default "";
}
map $upstream_http_referrer_policy $sec_referrer {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_permissions_policy $sec_permissions {
    ""      "camera=(), microphone=(), geolocation=()";
    default "";
}
# Report-only for now (watch the browser console, add report-uri before enforcing). Mirrors
# SecurityHeaders::PUBLIC_PAGE_CSP, so Metrika, GTM and the GTM bootstrap hash are allowed.
map "$upstream_http_content_security_policy$upstream_http_content_security_policy_report_only" $sec_csp_ro {
    ""      "default-src 'self'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://www.googletagmanager.com https://ssl.gstatic.com https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com https://www.googletagmanager.com https://tagmanager.google.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'sha256-D5+GwdC+PUxsOwaxQy1A2Ds5oaqtclyFJVL+ljnFIQY=' https://www.googletagmanager.com https://tagmanager.google.com https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; connect-src 'self' https://www.googletagmanager.com https://www.google.com https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://mc.webvisor.org https://mc.webvisor.com; child-src blob: https://mc.yandex.ru https://mc.yandex.com; frame-src blob: https://www.googletagmanager.com https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrica.yandex.com https://metrika.yandex.by https://metrika.yandex.kz https://metrika.ya.ru https://metrica.ya.ru https://analytics.yandex.ru https://analytics.yandex.com; base-uri 'self'; form-action 'self'";
    default "";
}

server {
    server_name ruappstore.com www.ruappstore.com;
    root /var/www/storefront/app/backend/public;
    index index.html index.php;

    # IPA chunks are 8 MB; the runner uploads whole signed builds.
    client_max_body_size 4g;
    client_body_timeout 300s;

    # One address for search engines: pages on www.ruappstore.com move to ruappstore.com. The API
    # answers on both hosts, because a redirected POST would lose its body.
    set $to_apex 0;
    if ($host = www.ruappstore.com) { set $to_apex 1; }
    if ($request_uri ~ ^/api/) { set $to_apex 0; }
    if ($to_apex) { return 301 https://ruappstore.com$request_uri; }

    # One address per page: /index.html is the homepage, and catalog/blog pages have no trailing
    # slash. $request_uri is the address the client asked for, so the `index` directive's own
    # internal jump from / to /index.html never matches here.
    if ($request_uri ~ "^/index\.html(\?.*)?$") { return 301 /$1; }
    if ($request_uri ~ "^/((apps|categories|blog)(/[^?]*[^/?])?)/+(\?.*)?$") { return 301 /$1$4; }

    server_tokens off;

    # add_header in a location replaces ALL server-level ones: every location below that has its
    # own add_header repeats this whole set.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header X-Frame-Options $sec_xfo always;
    add_header Referrer-Policy $sec_referrer always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Content-Security-Policy-Report-Only $sec_csp_ro always;

    # JSON, CSS, JS and SVG compress well; nginx only compresses HTML by default.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/css application/javascript text/plain application/xml image/svg+xml;

    # Catalog pictures get a new random file name on every upload, so a copy never goes stale.
    location ^~ /storage/catalog/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        access_log off;
    }

    # Vite bundles carry a content hash in the name; the logos, icons and stage art are renamed when they change.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2|webp|png|jpg|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
    }
    # No ^~ here: a ^~ prefix match would stop nginx from trying the hashed-file regex above.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
    }

    # The admin panel's ES modules have no hash in their names: revalidate them on every load,
    # or a browser keeps running last deploy's code against the new API.
    location ^~ /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
    }

    # IPA transfers (customer downloads, the runner's source relay and signed upload) hold a PHP
    # worker for minutes: they run in their own pool (ops/php-fpm/storefront-transfers.conf), so
    # the site and the API keep answering. Unbuffered: no temporary file per download on disk,
    # and the PHP side only finishes once the client has the bytes, so DELIVERED means delivered.
    location ~ ^/api/(v1/downloads/|worker/v1/jobs/[^/]+/(source|artifact)$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-transfers.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # Prices and purchase moved to the purchase page.
    location = /pricing.html { return 301 /buy.html$is_args$args; }

    location = /api/v1/mx-relay/register {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /api/v1/vk-relay/register {
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) { deny all; }

    listen 127.0.0.1:8444 ssl http2 proxy_protocol; # behind stream.d/sni-443.conf
    ssl_certificate /etc/letsencrypt/live/ruappstore.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ruappstore.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ruappstore.com) {
        return 301 https://ruappstore.com$request_uri;
    } # managed by Certbot


    if ($host = ruappstore.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ruappstore.com www.ruappstore.com;
    return 404; # managed by Certbot




}
