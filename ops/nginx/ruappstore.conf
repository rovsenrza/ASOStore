server {
    server_name ruappstore.com www.ruappstore.com;
    root /var/www/storefront/app/backend/public;
    index index.html index.php;

    # IPA chunks are 8 MB; the runner uploads whole signed builds.
    client_max_body_size 4g;
    client_body_timeout 300s;

    # One address for search engines: pages on www.ruappstore.com move to ruappstore.com. The API
    # answers on both hosts, because a redirected POST would lose its body.
    set $to_apex 0;
    if ($host = www.ruappstore.com) { set $to_apex 1; }
    if ($request_uri ~ ^/api/) { set $to_apex 0; }
    if ($to_apex) { return 301 https://ruappstore.com$request_uri; }

    add_header X-Content-Type-Options nosniff always;

    # JSON, CSS, JS and SVG compress well; nginx only compresses HTML by default.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/css application/javascript text/plain application/xml image/svg+xml;

    # Catalog pictures get a new random file name on every upload, so a copy never goes stale.
    location ^~ /storage/catalog/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Vite bundles carry a content hash in the name; the logos, icons and stage art are renamed when they change.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2|webp|png|jpg|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # IPA transfers (customer downloads, the runner's source relay and signed upload) hold a PHP
    # worker for minutes: they run in their own pool (ops/php-fpm/storefront-transfers.conf), so
    # the site and the API keep answering. Unbuffered: no temporary file per download on disk,
    # and the PHP side only finishes once the client has the bytes, so DELIVERED means delivered.
    location ~ ^/api/(v1/downloads/|worker/v1/jobs/[^/]+/(source|artifact)$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-transfers.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # Prices and purchase moved to the purchase page.
    location = /pricing.html { return 301 /buy.html$is_args$args; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) { deny all; }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ruappstore.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ruappstore.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ruappstore.com) {
        return 301 https://ruappstore.com$request_uri;
    } # managed by Certbot


    if ($host = ruappstore.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ruappstore.com www.ruappstore.com;
    return 404; # managed by Certbot




}