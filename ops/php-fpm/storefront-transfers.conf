; IPA transfers: customer downloads of signed builds, and the runner's source relay and
; signed-build upload. Each one holds a worker for the whole transfer (minutes for a large
; app on a phone connection), so they get their own pool: the www pool keeps answering the
; site, the API and the admin panel however many installs are running.
; Install: /etc/php/8.3/fpm/pool.d/storefront-transfers.conf, then `php-fpm8.3 -t` and
; `systemctl reload php8.3-fpm`; nginx routes the transfer URLs here (ops/nginx/ruappstore.conf).
[storefront-transfers]
user = storefront
group = www-data
listen = /run/php/php8.3-fpm-transfers.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Workers only exist while transfers run. One relaying worker uses about 30 MB.
pm = ondemand
pm.max_children = 40
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Wall-clock ceiling: a stalled client cannot hold a worker forever.
request_terminate_timeout = 2h
php_admin_value[memory_limit] = 256M
