<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — [BRAND] Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <main class="login-page" id="main">
    <div class="card login-card">
      <h1>[BRAND] Admin</h1>
      <div id="login-status" aria-live="assertive"></div>

      <form id="password-step" class="stack" novalidate>
        <div class="field">
          <label for="email">Эл. почта</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button--primary" type="submit">Продолжить</button>
      </form>

      <div id="enrollment" class="enrollment"></div>

      <form id="totp-step" class="stack" novalidate hidden>
        <div class="field">
          <label for="otp">Код из приложения-аутентификатора</label>
          <input id="otp" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <button class="button button--primary" type="submit">Войти</button>
      </form>
    </div>
  </main>
</body>
</html>
