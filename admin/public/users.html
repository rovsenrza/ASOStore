<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ru-appstore-logo-32.png">
  <link rel="apple-touch-icon" href="assets/brand/ru-appstore-logo-180.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Пользователи — Ru AppStore Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/pages/users.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><img src="assets/brand/ru-appstore-logo-64.png" alt="" width="32" height="32">Ru AppStore<small>Операторская панель</small></a>
      <nav aria-label="Разделы">
        <a href="index.html">Панель</a>
        <a href="users.html">Пользователи</a>
        <a href="devices.html">Устройства</a>
        <a href="home.html">Главная приложения</a>
        <a href="apps.html">Приложения</a>
        <a href="artifacts.html">Артефакты</a>
        <a href="teams.html">Команды Apple</a>
        <a href="jobs.html">Задачи</a>
        <a href="audit.html">Аудит</a>
      </nav>
      <p class="sidebar-foot">Доступ по ролям. Все действия записываются в журнал аудита.</p>
    </aside>
    <div class="main">
      <header class="topbar"><h1>Пользователи</h1></header>
      <main class="content" id="main">
        <div class="page-actions">
          <div class="tabs" role="tablist" aria-label="Разделы">
            <button type="button" role="tab" id="tab-users" aria-controls="panel-users" aria-selected="true">Пользователи</button>
            <button type="button" role="tab" id="tab-codes" aria-controls="panel-codes" aria-selected="false" tabindex="-1">Коды активации</button>
            <button type="button" role="tab" id="tab-tickets" aria-controls="panel-tickets" aria-selected="false" tabindex="-1">Обращения</button>
          </div>
          <button type="button" class="button button--primary" id="create-user" hidden>Добавить сотрудника</button>
        </div>

        <section id="panel-users" role="tabpanel" aria-labelledby="tab-users">
          <div id="users-table"></div>
        </section>

        <section id="panel-tickets" role="tabpanel" aria-labelledby="tab-tickets" hidden>
          <div id="tickets-table"></div>
        </section>

        <section id="panel-codes" role="tabpanel" aria-labelledby="tab-codes" hidden>
          <form class="card generate-form" id="generate-form" novalidate hidden>
            <h2>Выпустить коды</h2>
            <div class="form-grid">
              <label class="field">Количество
                <input name="count" type="number" min="1" max="500" value="10" required>
              </label>
              <label class="field">Срок подписки, дней
                <input name="duration_days" type="number" min="1" max="3650" value="365" aria-describedby="duration-hint">
                <span class="hint" id="duration-hint">Пусто — без ограничения срока.</span>
              </label>
              <label class="field">Активировать до
                <input name="expires_at" type="datetime-local" aria-describedby="expires-hint">
                <span class="hint" id="expires-hint">Пусто — код не истекает.</span>
              </label>
              <label class="field">Заметка
                <input name="note" maxlength="255" autocomplete="off">
              </label>
            </div>
            <div class="button-row"><button type="submit" class="button button--primary">Выпустить коды</button></div>
          </form>
          <div id="generate-result"></div>
          <div id="codes-table"></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
