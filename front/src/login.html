<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход — Ru App Store</title>
  <meta name="description" content="Вход в аккаунт Ru App Store.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b45e6">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/ru-app-store-logo-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/ru-app-store-logo-180.png">
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <!--#header-->

  <main id="main">
    <section class="page-hero" aria-labelledby="page-title">
      <h1 id="page-title">Вход</h1>
      <p>Войдите, чтобы зарегистрировать iPhone и следить за статусом.</p>
    </section>

    <div class="page-body">
      <form class="form" id="login-form" novalidate>
        <div class="form-status"></div>
        <div class="field">
          <label for="login-email">Эл. почта</label>
          <input id="login-email" class="ym-disable-keys" name="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary-button" type="submit">Войти <span aria-hidden="true">→</span></button>
        <p class="form-footer"><a href="/forgot-password.html">Забыли пароль?</a></p>
        <p class="form-footer">Нет аккаунта? <a href="/register.html">Зарегистрируйтесь</a></p>
      </form>
    </div>
  </main>

  <!--#footer-->
</body>
</html>
