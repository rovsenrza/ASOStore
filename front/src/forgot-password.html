<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сброс пароля — Ru AppStore</title>
  <meta name="description" content="Сброс пароля аккаунта Ru AppStore.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b45e6">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/ru-appstore-logo-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/ru-appstore-logo-180.png">
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/pages/forgot-password.js"></script>
</head>
<body>
  <!--#header-->

  <main id="main">
    <section class="page-hero" aria-labelledby="page-title">
      <h1 id="page-title">Сброс пароля</h1>
      <p>Укажите эл. почту аккаунта — мы отправим ссылку для нового пароля.</p>
    </section>

    <div class="page-body">
      <form class="form" id="forgot-form" novalidate>
        <div class="form-status"></div>
        <div class="field">
          <label for="forgot-email">Эл. почта</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <button class="primary-button" type="submit">Отправить ссылку <span aria-hidden="true">→</span></button>
        <p class="form-footer"><a href="/login.html">Вернуться ко входу</a></p>
      </form>
    </div>
  </main>

  <!--#footer-->
</body>
</html>
