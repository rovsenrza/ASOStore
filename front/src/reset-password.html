<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Новый пароль — Ru AppStore</title>
  <meta name="description" content="Новый пароль для аккаунта Ru AppStore.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b45e6">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/ru-appstore-logo-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/ru-appstore-logo-180.png">
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/pages/reset-password.js"></script>
</head>
<body>
  <!--#header-->

  <main id="main">
    <section class="page-hero" aria-labelledby="page-title">
      <h1 id="page-title">Новый пароль</h1>
      <p>После смены пароля все прежние сеансы, включая приложение, будут завершены.</p>
    </section>

    <div class="page-body">
      <form class="form" id="reset-form" novalidate>
        <div class="form-status"></div>
        <input type="hidden" name="token">
        <div class="field">
          <label for="reset-email">Эл. почта</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" readonly required>
        </div>
        <div class="field">
          <label for="reset-password">Новый пароль</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="10" aria-describedby="reset-password-hint" required>
          <p class="field-hint" id="reset-password-hint">Не менее 10 символов, хотя бы одна буква и одна цифра.</p>
        </div>
        <button class="primary-button" type="submit">Сохранить пароль <span aria-hidden="true">→</span></button>
      </form>
    </div>
  </main>

  <!--#footer-->
</body>
</html>
