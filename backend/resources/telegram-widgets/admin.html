<style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.3 system-ui,sans-serif;color:var(--tg-theme-text-color);padding:12px;display:grid;gap:10px}
.h{display:flex;justify-content:space-between;align-items:center}
.t{font-weight:700;font-size:17px}
.n{font-size:12px;color:var(--tg-theme-hint-color)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.k{padding:8px 10px;border-radius:12px;background:var(--tg-theme-secondary-bg-color)}
.k b{display:block;font-size:19px}
.k span{font-size:11px;color:var(--tg-theme-hint-color)}
.k.w b{color:#d9822b}
.r{display:flex;flex-wrap:wrap;gap:6px}
.c{flex:1 1 30%;padding:8px 4px;border:0;border-radius:12px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);font:inherit;font-size:13px}
.c.s{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
</style>
<div id=a></div>
<script>
var W=window.TelegramWidget,A=document.getElementById('a'),D={},msg='';
function E(t,c,x,f){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(f)e.onclick=f;return e}
function load(){try{D=JSON.parse(W&&W.chatData||'{}')||{}}catch(e){D={}}}
function send(d){W.request(d).then(function(){msg=d.indexOf('w:')==0?'':'✓ Ответ ниже ↓';draw()},function(e){msg='Не получилось: '+(e&&e.code||'?');draw()});msg='…';draw()}
function row(l){var r=E('div','r');l.forEach(function(x){r.appendChild(E('button','c'+(x[2]?' s':''),x[0],function(){send(x[1])}))});return r}
function draw(){
A.textContent='';var h=E('div','h');h.appendChild(E('div','t','🛠 Админ-панель'));h.appendChild(E('div','n',D.u||''));A.appendChild(h);
A.appendChild(row([['Сегодня','w:a:1',D.d==1],['7 дней','w:a:7',D.d==7],['30 дней','w:a:30',D.d==30]]));
var g=E('div','g');(D.k||[]).forEach(function(x){var k=E('div','k'+(x[2]?' w':''));k.appendChild(E('b','',x[1]));k.appendChild(E('span','',x[0]));g.appendChild(k)});A.appendChild(g);
A.appendChild(row([['🧾 Проверка ('+(D.r||0)+')','adm:reviews',D.r>0],['📊 Подробно','adm:stats:'+(D.d||7)],['🔎 Клиент','adm:find'],['🎟 Промокоды','adm:promos'],['💲 Цены','adm:prices'],['📣 Рассылка','adm:bc']]));
A.appendChild(E('div','n',msg||'Обновлено '+(D.at||'')+' · ↻ нажмите период'));
}
load();draw();
if(W){W.onEvent('chatDataChanged',function(){load();draw()});W.ready()}
</script>
