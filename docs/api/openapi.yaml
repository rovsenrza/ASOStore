openapi: 3.1.0
info:
  title: "Ru AppStore API"
  version: 1.0.0-dev
  summary: Customer, admin and worker API for the web portal, admin panel and native Storefront.
  description: |
    Contract-first source of truth (IMPLEMENTATION_PLAN D11). Every response uses the
    `{data, meta, error}` envelope. Clients must branch on `error.code`, never on `error.message`.

    Examples for each response live in `docs/api/examples/` and are validated against
    these schemas by the backend test suite and decoded by the iOS test suite.
  contact:
    name: "Ru AppStore engineering"
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Activation
  - name: Devices
  - name: Storefront
  - name: Catalog
  - name: Install
    description: 'Preparation and OTA installation (IMPLEMENTATION_PLAN §5.6). The worker API for the signing runner is documented in runner/README.md.'
  - name: Support
    description: 'Support requests and the customer’s own data (IMPLEMENTATION_PLAN P8-WEB-01, P8-SEC-02).'
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 'Liveness and database check'
      description: 'Returns 200 when the API and database answer; 503 with SERVICE_UNAVAILABLE otherwise. Used by monitoring and the admin dashboard.'
      responses:
        "200":
          description: Service is healthy
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                ok: { externalValue: examples/health.json }
        "503":
          $ref: "#/components/responses/Error"

  /storefront/feed:
    get:
      tags: [Storefront]
      operationId: getStorefrontFeed
      summary: 'Curated sections for the Home, Games and Apps tabs'
      description: 'Featured, most downloaded, trending, recently updated, new and category sections of published listings. Download rankings count delivered installations (trending: last 7 days); a section without data is omitted. Each app carries the caller''s install_state.'
      parameters:
        - name: kind
          in: query
          description: 'games or apps limits every section to categories of that kind; omitted = everything (Home tab).'
          schema: { type: string, enum: [apps, games] }
      responses:
        "200":
          description: Feed sections; empty sections are omitted
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedResponse" }
              examples:
                feed: { externalValue: examples/storefront-feed.json }

  /storefront/status:
    get:
      tags: [Storefront]
      operationId: getStorefrontStatus
      summary: 'Aggregated readiness and the next action for the caller'
      description: 'Works signed out. Sign-in, activation and device stages are added in Phases 2–3.'
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Current stage
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontStatusResponse" }
              examples:
                signedOut: { externalValue: examples/storefront-status-signed-out.json }

  /apps:
    get:
      tags: [Catalog]
      operationId: listApps
      summary: 'Search and browse published listings'
      description: 'Only listings with visibility PUBLISHED are returned. Draft, hidden and deleted listings are never visible here.'
      parameters:
        - name: q
          in: query
          description: Matches name, subtitle, publisher and category title.
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Category slug.
          schema: { type: string, maxLength: 64 }
        - name: kind
          in: query
          description: Only apps in categories of this kind.
          schema: { type: string, enum: [apps, games] }
        - name: sort
          in: query
          description: 'featured (default), updated (newest release first) or new (newest listing first).'
          schema: { type: string, enum: [featured, updated, new], default: featured }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of apps
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppListResponse" }
              examples:
                list: { externalValue: examples/apps-list.json }
        "422":
          $ref: "#/components/responses/Error"

  /apps/{id}:
    get:
      tags: [Catalog]
      operationId: getApp
      summary: 'App page'
      description: 'Returns 404 NOT_FOUND for listings customers cannot see.'
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: The app
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetailResponse" }
              examples:
                detail: { externalValue: examples/app-detail.json }
        "404":
          $ref: "#/components/responses/Error"

  /apps/{id}/versions:
    get:
      tags: [Catalog]
      operationId: listAppVersions
      summary: 'Version history, newest first'
      description: 'Versions of a published listing ordered by release date, newest first.'
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Versions
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionListResponse" }
              examples:
                versions: { externalValue: examples/app-versions.json }
        "404":
          $ref: "#/components/responses/Error"

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 'Create a customer account (browser)'
      description: 'Creates a customer, signs the browser session in and returns the account. Same-origin browser requests only; the native app uses /auth/tokens.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 'Sign in the browser session'
      description: 'Session cookie sign-in for the portal (Sanctum SPA). Wrong credentials return INVALID_CREDENTIALS; suspended accounts ACCOUNT_SUSPENDED.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/tokens:
    post:
      tags: [Auth]
      operationId: issueTokens
      summary: 'Issue native app tokens'
      description: 'Returns a 15-minute access token and a 30-day rotating refresh token (IMPLEMENTATION_PLAN D3).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "201":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
              examples:
                example: { externalValue: examples/auth-tokens.json }
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: 'Rotate native app tokens'
      description: 'Spends the refresh token and returns a new pair. Reusing a spent token revokes its whole family and returns SESSION_EXPIRED.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
              examples:
                example: { externalValue: examples/auth-tokens.json }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 'Sign out'
      description: 'Ends the browser session, or revokes the bearer token and its refresh-token family.'
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmptyResponse" }
        "401":
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 'Current customer'
      description: 'The signed-in account with its active subscription.'
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
              examples:
                example: { externalValue: examples/auth-me.json }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: 'Request a password reset email'
      description: 'Always answers 202, whether or not the account exists.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 'Set a new password'
      description: 'Uses the token from the reset email. Ends every session and native token of the account.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /activation/redeem:
    post:
      tags: [Activation]
      operationId: redeemActivationCode
      summary: 'Redeem an activation code'
      description: 'Creates (or extends) the customer''s subscription. Accepts lower case, spaces and Crockford look-alikes (O→0, I/L→1).'
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "201":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemResponse" }
              examples:
                example: { externalValue: examples/activation-redeem.json }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /admin/auth/login:
    post:
      tags: [Admin]
      operationId: adminLogin
      summary: 'Staff sign-in, step 1: password'
      description: 'Starts a pending sign-in. The response says whether a TOTP code is expected or an authenticator must be enrolled first; the session is not authenticated until step 2.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginStepResponse" }
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /admin/auth/totp:
    post:
      tags: [Admin]
      operationId: adminTotp
      summary: 'Staff sign-in, step 2: TOTP code'
      description: 'Completes the pending sign-in within 5 minutes. Codes cannot be reused.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMeResponse" }
              examples:
                example: { externalValue: examples/admin-me.json }
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /admin/auth/me:
    get:
      tags: [Admin]
      operationId: adminMe
      summary: 'Current operator'
      description: 'Roles and granted permissions; the admin UI hides what is not granted.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMeResponse" }
              examples:
                example: { externalValue: examples/admin-me.json }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/auth/logout:
    post:
      tags: [Admin]
      operationId: adminLogout
      summary: 'Staff sign-out'
      description: 'Ends the admin browser session.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmptyResponse" }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: 'List users'
      description: 'Requires users.view.'
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserListResponse" }
              examples:
                example: { externalValue: examples/admin-users.json }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: 'Create a user'
      description: 'Requires users.manage. Emails the new user a link to set their password.'
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/users/{id}:
    get:
      tags: [Admin]
      operationId: adminGetUser
      summary: 'User detail'
      description: 'Requires users.view. Includes subscriptions and the 20 most recent audit events about or by the user.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetailResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: 'Suspend or reactivate a user'
      description: 'Requires users.manage and a reason. Suspension ends every session and token.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/roles:
    put:
      tags: [Admin]
      operationId: adminSetUserRoles
      summary: 'Replace a user''s roles'
      description: 'Requires users.manage and a reason. Admins cannot remove their own admin role.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRolesRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/totp/reset:
    post:
      tags: [Admin]
      operationId: adminResetTotp
      summary: 'Reset a user''s authenticator'
      description: 'Requires users.manage and a reason. The user enrols again at the next admin sign-in.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/activation-codes:
    get:
      tags: [Admin]
      operationId: adminListActivationCodes
      summary: 'List activation codes'
      description: 'Requires activation-codes.view. Codes are never returned, only their last four characters.'
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ActivationCodeStatus" }
        - name: batch
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: q
          in: query
          description: Last four characters.
          schema: { type: string, maxLength: 8 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationCodeListResponse" }
              examples:
                example: { externalValue: examples/admin-activation-codes.json }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      tags: [Admin]
      operationId: adminCreateActivationCodes
      summary: 'Generate activation codes'
      description: 'Requires activation-codes.manage. The plaintext codes are in this response only. Send an Idempotency-Key so a retry does not create a second batch.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActivationCodesRequest" }
      responses:
        "201":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationCodeBatchResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/activation-codes/{id}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokeActivationCode
      summary: 'Revoke an unused activation code'
      description: 'Requires activation-codes.manage and a reason. Only ISSUED codes can be revoked.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ActivationCodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationCodeResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminListAuditLogs
      summary: 'Search the audit log'
      description: 'Requires audit.view. `action` matches as a prefix ("user." finds every user event).'
      security:
        - sessionCookie: []
      parameters:
        - name: action
          in: query
