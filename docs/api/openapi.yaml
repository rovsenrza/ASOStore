  /devices/enrollment-profile:
    get:
      tags: [Devices]
      operationId: downloadEnrollmentProfile
      summary: Download the enrollment profile (Safari on the iPhone)
      description: 'Returns an iOS Profile Service .mobileconfig that asks the device for its UDID, model and iOS version and posts them to /devices/enrollment/callback with a single-use challenge (15 minutes). Requires an active subscription. Signed with the site certificate when configured.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The profile
          content:
            application/x-apple-aspen-config:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /devices/enrollment/callback:
    post:
      tags: [Devices]
      operationId: completeEnrollment
      summary: Device answer from the enrollment profile (called by iOS)
      description: 'The body is the DER-encoded CMS message iOS sends: a plist with UDID, PRODUCT, VERSION and CHALLENGE, signed by the device. The answer is always a redirect to /activate.html with either enrolled=<device id> or enrollment_error=<error code>.'
      security: []
      parameters:
        - name: challenge
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/pkcs7-signature:
            schema: { type: string, format: binary }
      responses:
        "301":
          description: 'Back to the portal: /activate.html?enrolled=… or /activate.html?enrollment_error=…'
          headers:
            Location: { schema: { type: string } }
        "429":
          $ref: "#/components/responses/Error"

