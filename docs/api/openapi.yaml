      summary: Update a publisher
      description: 'Requires catalog.manage.'
      security:
        - sessionCookie: []
      parameters:
        - name: publisher
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePublisherRequest" }
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPublisherResponse" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /admin/uploads:
    post:
      tags: [Admin]
      operationId: adminStartUpload
      summary: Start a resumable IPA upload
      description: 'Requires artifacts.manage. The declaration must be accepted before any bytes are uploaded.'
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/uploads/{upload}:
    get:
      tags: [Admin]
      operationId: adminGetUpload
      summary: Query upload progress and missing chunks
      description: 'Requires artifacts.view.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Upload state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/uploads/{upload}/chunks/{number}:
    put:
      tags: [Admin]
      operationId: adminPutUploadChunk
      summary: Store or idempotently replay one IPA chunk
      description: 'Requires artifacts.manage. Chunks are 8 MiB except for the final chunk.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: number
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: X-Chunk-SHA256
          in: header
          required: false
          schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadChunkResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/uploads/{upload}/complete:
    post:
      tags: [Admin]
      operationId: adminCompleteUpload
      summary: Assemble chunks, verify SHA-256 and create the source artifact
      description: 'Requires artifacts.manage. Hashing is streamed and does not load the IPA into memory. Queues InspectArtifactJob; replaying the call returns the same artifact and job.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "201":
          description: Artifact created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedArtifactResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/artifacts:
    get:
      tags: [Admin]
      operationId: adminListArtifacts
      summary: Review queue and artifact list
      description: 'Requires artifacts.view. `q` matches the file name, bundle ID or exact SHA-256.'
      security:
        - sessionCookie: []
      parameters:
        - name: status[]
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/ArtifactStatus" }
        - name: app_id
          in: query
          schema: { $ref: "#/components/schemas/PublicId" }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}:
    get:
      tags: [Admin]
      operationId: adminGetArtifact
      summary: Artifact detail with inspection report, reviews, documents, jobs and history
      description: 'Requires artifacts.view. `available_actions` lists the moves the caller may make now.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactDetailResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/review:
    post:
      tags: [Admin]
      operationId: adminReviewArtifact
      summary: Approve or reject provenance review, or release/reject a quarantined file
      description: |
        Requires artifacts.manage. From PROVENANCE_REVIEW, `approve` needs every checklist item and, unless the
        malware scan reported CLEAN, `acknowledge_scan_result`; it moves through COMPATIBILITY_CHECK to READY or
        REJECTED (status_reason names the blocking finding). `reject` needs a reason → PROVENANCE_FAILED.
        From QUARANTINED, `approve` releases the file back to PROVENANCE_REVIEW (reason required) and `reject` →
        REJECTED. With STOREFRONT_INDEPENDENT_REVIEW the uploader cannot approve (403).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 2000 }
                checklist:
                  type: object
                  additionalProperties: { type: boolean }
                  description: 'Keys from review_checklist.items in the artifact detail.'
                acknowledge_scan_result: { type: boolean }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactReviewResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/publish:
    post:
      tags: [Admin]
      operationId: adminPublishArtifact
      summary: Publish a READY artifact
      description: 'Requires artifacts.manage. Only READY → PUBLISHED, and only for publishable source types. The previous published build of the app becomes EXPIRED (SUPERSEDED); the catalog version is created or linked.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokeArtifact
      summary: Revoke a READY or PUBLISHED artifact
      description: 'Requires artifacts.manage. Irreversible; the reason is audited.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/inspect:
    post:
      tags: [Admin]
      operationId: adminReinspectArtifact
      summary: Inspect an INSPECTION_FAILED artifact again
      description: 'Requires artifacts.manage. Queues a new InspectArtifactJob.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArtifactReinspectResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/documents:
    post:
      tags: [Admin]
      operationId: adminAddProvenanceDocument
      summary: Attach a provenance document (license, agreement, build log)
      description: 'Requires artifacts.manage. PDF, PNG, JPEG or plain text up to 20 MiB, stored privately.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvenanceDocumentResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/artifacts/{artifact}/documents/{document}:
    get:
      tags: [Admin]
      operationId: adminDownloadProvenanceDocument
      summary: Download a provenance document (audited)
      description: 'Requires artifacts.view.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: document
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PublicId" }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/jobs:
    get:
      tags: [Admin]
      operationId: adminListJobs
      summary: Pipeline jobs
      description: 'Requires jobs.view.'
      security:
        - sessionCookie: []
      parameters:
        - name: status[]
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/PipelineJobStatus" }
        - name: type
          in: query
          schema: { type: string, maxLength: 64 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/jobs/{job}:
    get:
      tags: [Admin]
      operationId: adminGetJob
      summary: Pipeline job with its attempts
      description: 'Requires jobs.view.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobDetailResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/jobs/{job}/retry:
    post:
      tags: [Admin]
      operationId: adminRetryJob
      summary: Retry a failed job once (audited)
      description: 'Requires jobs.manage. Only FAILED_RETRYABLE or FAILED_PERMANENT jobs; the idempotency key of the work is unchanged, so the work is never duplicated.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{id}/prepare:
    post:
      tags: [Install]
      operationId: prepareApp
      summary: Prepare the published build of an app for the calling device
      description: |
        Checks the device is ELIGIBLE, the app has a PUBLISHED artifact and the device is compatible (family,
        iOS version). Reuses a DELIVERABLE signed build for (artifact, device) when there is one (200, READY_TO_INSTALL);
        otherwise starts signing (202, PREPARING). Repeated calls return the same active installation.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Already prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationResponse" }
              examples:
                ready: { externalValue: examples/installation-ready.json }
        "202":
          description: Preparation started; poll GET /installations/{id}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationResponse" }
              examples:
                preparing: { externalValue: examples/installation-preparing.json }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /storefront/install:
    post:
      tags: [Install]
      operationId: installStorefront
      summary: Prepare the native Storefront itself for the account's device (portal install.html)
      description: 'Same flow as /apps/{id}/prepare for the catalog item flagged is_storefront (IMPLEMENTATION_PLAN §5.6).'
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Already prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationResponse" }
        "202":
          description: Preparation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /installations/{installation}:
    get:
      tags: [Install]
      operationId: getInstallation
      summary: Installation progress for the calling device (poll with backoff 3 s → 30 s)
      description: 'Only installations on the calling device are visible; others answer 404.'
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InstallationId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /installations/{installation}/authorize:
    post:
      tags: [Install]
      operationId: authorizeInstallation
      summary: Issue a single-use, device-bound install link (10 minutes)
      description: 'Returns an itms-services:// URL for openURL / location.assign. The manifest behind it can be fetched once.'
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InstallationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Link issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallLinkResponse" }
              examples:
                link: { externalValue: examples/install-link.json }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /library:
    get:
      tags: [Install]
      operationId: getLibrary
      summary: Latest installation per app on the calling device
      description: 'DELIVERED is the last state the server can observe (IMPLEMENTATION_PLAN G13).'
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryResponse" }
              examples:
                library: { externalValue: examples/library.json }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /install/{token}/manifest.plist:
    get:
      tags: [Install]
      operationId: getInstallManifest
      summary: OTA manifest, fetched by iOS (single-use token)
      description: 'Not JSON. Expired, reused or unknown tokens answer 410 INSTALL_TOKEN_EXPIRED; withdrawn artifacts 409.'
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Manifest property list
          content:
            application/xml:
              schema: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /downloads/installations/{installation}:
    get:
      tags: [Install]
      operationId: downloadSignedBuild
      summary: The signed IPA, via a 10-minute signed URL from the manifest
      description: 'Supports HTTP Range. Tampered or expired signatures answer 403 and are logged and audited.'
      parameters:
        - $ref: "#/components/parameters/InstallationId"
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: IPA bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /admin/runners:
    get:
      tags: [Admin]
      operationId: adminListRunners
      summary: Signing runner health, identities and current leases
      description: 'Requires jobs.view. A runner is online when its last heartbeat is under three minutes old.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/runners/{runner}:
    patch:
      tags: [Admin]
      operationId: adminUpdateRunner
      summary: Enable or disable a runner (audited)
      description: 'Requires teams.manage.'
      security:
        - sessionCookie: []
      parameters:
        - { name: runner, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/installations:
    get:
      tags: [Admin]
      operationId: adminListInstallations
      summary: Installations across devices
      description: 'Requires installations.view.'
      security:
        - sessionCookie: []
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/installations/{installation}:
    get:
      tags: [Admin]
      operationId: adminGetInstallation
      summary: Installation timeline (events with request IDs) and audit history
      description: 'Requires installations.view.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InstallationId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/apple-teams:
    get:
      tags: [Admin]
      operationId: adminListAppleTeams
      summary: Apple teams with credential state, membership year, quotas per family, eligibilities, certificates and profiles
      description: 'Requires teams.view (admin). meta.pending_assignments counts team assignments waiting for a decision.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      operationId: adminCreateAppleTeam
      summary: Record an existing Apple Developer team (PENDING_VERIFICATION)
      description: 'Requires teams.manage. Never creates an account at Apple (FULL_PLAN §6.3).'
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apple_team_id, name]
              properties:
                apple_team_id: { type: string, pattern: '^[A-Z0-9]{10}$' }
                name: { type: string, maxLength: 255 }
                membership_expires_at: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/apple-teams/{team}:
    patch:
      tags: [Admin]
      operationId: adminUpdateAppleTeam
      summary: Rename, change status or make primary (reason required, audited)
      description: 'Requires teams.manage. ACTIVE needs a successful connection test first (409 otherwise).'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                name: { type: string }
                status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, EXPIRING, SUSPENDED, REVOKED, DISCONNECTED] }
                is_primary: { type: boolean }
                storefront_app_id: { type: [string, "null"], description: "Public ID of this team's separately built Ru AppStore listing" }
                membership_expires_at: { type: [string, "null"], format: date-time }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/apple-teams/{team}/credentials:
    post:
      tags: [Admin]
      operationId: adminReplaceTeamCredential
      summary: Record the App Store Connect key reference for a team
      description: 'Requires teams.manage. The .p8 key is stored on the server with `php artisan apple:store-key`; only its reference is sent here. The previous key is revoked and the team must be verified again.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_id, key_id, vault_reference]
              properties:
                issuer_id: { type: string }
                key_id: { type: string, pattern: '^[A-Z0-9]{10}$' }
                vault_reference: { type: string }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/apple-teams/{team}/verify:
    post:
      tags: [Admin]
      operationId: adminVerifyAppleTeam
      summary: Test the App Store Connect connection
      description: 'Requires teams.manage. 422 APPLE_UNAVAILABLE when Apple rejects the key.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Connection works
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/apple-teams/{team}/membership-years:
    post:
      tags: [Admin]
      operationId: adminAddMembershipYear
      summary: Add a membership year (slots are counted per year)
      description: 'Requires teams.manage. A year covers [starts_at, ends_at) and may not overlap another active year (409).'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date }
                ends_at: { type: string, format: date }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleTeamResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/apple-teams/{team}/sync:
    post:
      tags: [Admin]
      operationId: adminSyncAppleTeam
      summary: Reconcile local counters with Apple now
      description: 'Requires teams.manage. Mismatches are audited and alerted, never corrected automatically.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/team-eligibilities:
    get:
      tags: [Admin]
      operationId: adminListTeamEligibilities
      summary: Which team may distribute which bundle ID
      description: 'Requires teams.view.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      operationId: adminApproveTeamEligibility
      summary: Approve a team for a bundle ID, with evidence
      description: 'Requires teams.manage. Without an approved eligibility an artifact fails COMPATIBILITY_CHECK with TEAM_NOT_ELIGIBLE and cannot be signed.'
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id, bundle_identifier, evidence]
              properties:
                team_id: { $ref: "#/components/schemas/PublicId" }
                bundle_identifier: { type: string }
                evidence: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/team-eligibilities/{eligibility}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokeTeamEligibility
      summary: Revoke an eligibility (reason required)
      description: 'Requires teams.manage.'
      security:
        - sessionCookie: []
      parameters:
        - { name: eligibility, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/quota-assignments:
    get:
      tags: [Admin]
      operationId: adminListTeamAssignments
      summary: Proposed moves of blocked devices to another eligible team
      description: 'Requires teams.view. Defaults to PENDING.'
      security:
        - sessionCookie: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/quota-assignments/{assignment}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveTeamAssignment
      summary: Approve a team assignment (reason required, audited)
      description: 'Requires teams.manage. Re-checks that the team is still eligible and has free slots (NO_ELIGIBLE_TEAM otherwise), then registers the device with it through the normal quota path.'
      security:
        - sessionCookie: []
      parameters:
        - { name: assignment, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/quota-assignments/{assignment}/reject:
    post:
      tags: [Admin]
      operationId: adminRejectTeamAssignment
      summary: Reject a team assignment (reason required, audited)
      description: 'Requires teams.manage. The device stays blocked.'
      security:
        - sessionCookie: []
      parameters:
        - { name: assignment, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /support/tickets:
    post:
      tags: [Support]
      operationId: createSupportTicket
      summary: Send a support request (signed in or not)
      description: 'Rate-limited to 10 per hour per IP. Signed-in customers do not need to send an email address.'
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, message]
              properties:
                email: { type: string, format: email, description: 'Required when signed out.' }
                topic: { type: string, enum: [ACTIVATION, DEVICE, INSTALL, ACCOUNT, DATA_DELETION, OTHER] }
                message: { type: string, minLength: 10, maxLength: 5000 }
                reference_request_id: { type: string, maxLength: 64, description: 'The request ID shown on an error screen.' }
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /account/export:
    get:
      tags: [Support]
      operationId: exportAccountData
      summary: Everything stored about the caller's account (UDID masked)
      description: 'Audited. 5 requests per hour.'
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /account/deletion-request:
    post:
      tags: [Support]
      operationId: requestAccountDeletion
      summary: Ask for the account to be deleted
      description: 'Creates (once) a DATA_DELETION support ticket; an operator performs the erasure after checks.'
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "202":
          description: Request recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /admin/metrics:
    get:
      tags: [Admin]
      operationId: adminGetMetrics
      summary: Latest FULL_PLAN §14 metrics snapshot
      description: 'Requires jobs.view. Snapshots are taken every five minutes by the scheduler.'
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/support-tickets:
    get:
      tags: [Admin]
      operationId: adminListSupportTickets
      summary: Support tickets
      description: 'Requires users.view.'
      security:
        - sessionCookie: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/support-tickets/{ticket}/close:
    post:
      tags: [Admin]
      operationId: adminCloseSupportTicket
      summary: Close a ticket (reason required, audited)
      description: 'Requires users.view.'
      security:
        - sessionCookie: []
      parameters:
        - { name: ticket, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/users/{user}/erase:
    post:
      tags: [Admin]
      operationId: adminEraseUser
      summary: Irreversibly erase a user's personal data
      description: 'Requires users.manage. Revokes sessions and tokens, disables device registrations, replaces name and email. The encrypted UDID is purged by the retention job once the Apple membership year has ended.'
      security:
        - sessionCookie: []
      parameters:
        - { name: user, in: path, required: true, schema: { $ref: "#/components/schemas/PublicId" } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_email, reason]
              properties:
                confirm_email: { type: string, description: "Must equal the user's current email." }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Erased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Sanctum access token (native app). Browsers use the session cookie instead.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: brand_session
      description: 'Laravel session cookie for same-origin browser requests (Sanctum SPA). Mutating requests also send X-XSRF-TOKEN from the XSRF-TOKEN cookie (GET /sanctum/csrf-cookie).'

  headers:
    RequestId:
      description: 'Echoes a well-formed client X-Request-Id or returns a generated one. Quote it in support tickets.'
      schema: { type: string }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, maxLength: 2000 }

  parameters:
    UploadId:
      name: upload
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }

    ArtifactId:
      name: artifact
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }

    InstallationId:
      name: installation
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }

    TeamId:
      name: team
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }

    JobId:
      name: job
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicId" }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Retries with the same key and body replay the first response (Idempotent-Replayed header); a different body returns IDEMPOTENCY_CONFLICT. Kept 24 hours.'
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{8,128}$" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    UserId:
      name: id
      in: path
      required: true
      description: 'User public ID (ULID).'
      schema: { $ref: "#/components/schemas/PublicId" }
    DeviceId:
      name: id
      in: path
      required: true
      description: Device public ID (ULID).
      schema: { $ref: "#/components/schemas/PublicId" }
    ActivationCodeId:
      name: id
      in: path
      required: true
      description: 'Activation code public ID (ULID).'
      schema: { $ref: "#/components/schemas/PublicId" }
    AppId:
      name: id
      in: path
      required: true
      description: 'App public ID (ULID).'
      schema: { $ref: "#/components/schemas/PublicId" }

  responses:
    Error:
      description: 'Error envelope'
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            notFound: { externalValue: examples/error-not-found.json }
            validation: { externalValue: examples/error-validation.json }

  schemas:
    PublicId:
      type: string
      description: 'Lower-case ULID.'
      pattern: "^[0-9a-hjkmnp-tv-z]{26}$"

    Timestamp:
      type: string
      format: date-time

    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        pagination: { $ref: "#/components/schemas/Pagination" }

    Pagination:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }

    ErrorCode:
      type: string
      description: 'Stable machine-readable code (IMPLEMENTATION_PLAN §5.2). New codes may be added; clients must treat unknown codes as INTERNAL.'
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - ACCOUNT_SUSPENDED
        - TOTP_REQUIRED
        - TOTP_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - ILLEGAL_STATE_TRANSITION
        - RATE_LIMITED
        - ACTIVATION_INVALID
        - ACTIVATION_ALREADY_USED
        - ENROLLMENT_CHALLENGE_EXPIRED
        - DEVICE_NOT_ELIGIBLE
        - DEVICE_LIMIT_REACHED
        - DEVICE_OWNED_ELSEWHERE
        - ENROLLMENT_PAYLOAD_INVALID
        - APPLE_NOT_CONNECTED
        - CLAIM_INVALID
        - DEVICE_PENDING_APPLE
        - QUOTA_EXHAUSTED
        - NO_ELIGIBLE_TEAM
        - ARTIFACT_NOT_INSTALLABLE
        - INCOMPATIBLE_DEVICE
        - INSTALL_TOKEN_EXPIRED
        - DUPLICATE_ARTIFACT
        - UPLOAD_INCOMPLETE
        - UPLOAD_CORRUPT
        - VERSION_EXISTS
        - ENCRYPTED_BINARY
        - SOURCE_TYPE_NOT_PUBLISHABLE
        - IDEMPOTENCY_CONFLICT
        - APPLE_UNAVAILABLE
        - SERVICE_UNAVAILABLE
        - INTERNAL

    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Russian fallback text. Display only when the client has no copy for `code`.
        details:
          type: object
          description: Code-specific details. VALIDATION_FAILED carries `fields` (field → messages).

    ErrorResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
        error: { $ref: "#/components/schemas/Error" }

    Health:
      type: object
      required: [status, version, time, checks]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        time: { $ref: "#/components/schemas/Timestamp" }
        checks:
          type: object
          additionalProperties: { type: string }

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/Health" }

    SuccessEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        error: { type: "null" }

    InstallState:
      type: object
      description: |
        The install CTA for this app and the calling device. Clients render the CTA from
        this object only (FULL_PLAN §11).
          - unavailable: no installable artifact exists
          - not_eligible: an artifact exists but this user/device cannot install it yet (see reason)
          - get / preparing / ready_to_install / update_available / failed
          - get also follows a delivered install of the current build: iOS does not report whether the
            app is still installed, so it can always be installed again (the signed build is reused)
          - delivered: no longer reported; kept for older clients
      required: [status, reason, progress, installation_id]
      properties:
        status:
          type: string
          enum: [unavailable, not_eligible, get, preparing, ready_to_install, delivered, update_available, failed]
        reason:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        progress:
          description: 0–1 while preparing, otherwise null.
          type: [number, "null"]
          minimum: 0
          maximum: 1
        installation_id:
          oneOf:
            - $ref: "#/components/schemas/PublicId"
            - type: "null"

    CategoryKind:
      type: string
      description: 'Storefront tab the category belongs to.'
      enum: [APPS, GAMES]

    CategoryRef:
      type: object
      required: [id, slug, title, kind]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        title: { type: string }
        kind: { $ref: "#/components/schemas/CategoryKind" }

    Category:
      type: object
      required: [id, slug, title, subtitle]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        app_count: { type: integer, minimum: 0 }

    PublisherRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        website: { type: [string, "null"] }

    LatestVersion:
      type: object
      required: [version, build_number, min_ios_version, released_at, size_bytes]
      properties:
        version: { type: string }
        build_number: { type: string }
        min_ios_version: { type: [string, "null"] }
        released_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        size_bytes:
          description: Size of the published artifact; null while nothing is published.
          type: [integer, "null"]
          minimum: 0

    AppSummary:
      type: object
      required: [id, slug, name, subtitle, category, publisher, icon_url, age_rating, latest_version, install_state]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        name: { type: string }
        subtitle: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/CategoryRef" }
        publisher: { $ref: "#/components/schemas/PublisherRef" }
        icon_url: { type: [string, "null"] }
        feature_image_url: { type: [string, "null"], description: 'Banner for hero cards: the first screenshot, when there is one.' }
        age_rating: { type: string }
        latest_version:
          oneOf:
            - $ref: "#/components/schemas/LatestVersion"
            - type: "null"
        install_state: { $ref: "#/components/schemas/InstallState" }

    Screenshot:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    AppDetail:
      allOf:
        - $ref: "#/components/schemas/AppSummary"
        - type: object
          required: [description, release_notes, screenshots, support_url, privacy_url]
          properties:
            description: { type: [string, "null"] }
            release_notes: { type: [string, "null"] }
            support_url: { type: [string, "null"] }
            privacy_url: { type: [string, "null"] }
            screenshots:
              type: array
              items: { $ref: "#/components/schemas/Screenshot" }

    Version:
      type: object
      required: [id, version, build_number, release_notes, min_ios_version, released_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        version: { type: string }
        build_number: { type: string }
        release_notes: { type: [string, "null"] }
        min_ios_version: { type: [string, "null"] }
        released_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    FeedSection:
      type: object
      required: [id, kind, title]
      properties:
        id: { type: string }
        kind:
          type: string
          description: featured (first app is the hero), carousel, categories. Unknown kinds must be skipped by clients.
        title: { type: string }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppSummary" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    Feed:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/FeedSection" }

    StorefrontStatus:
      type: object
      required: [stage, next_action, blocking_reason, device]
      properties:
        stage:
          type: string
          enum: [signed_out, activation_required, device_required, device_pending, storefront_ready, storefront_installed, blocked]
        next_action:
          type: string
          enum: [sign_in, redeem_activation, enroll_device, wait_apple, install_storefront, open_storefront, blocked]
        blocking_reason:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        device:
          description: The most recently enrolled device, once there is one.
          oneOf:
            - $ref: "#/components/schemas/DeviceSummary"
            - type: "null"

    FeedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/Feed" }

    StorefrontStatusResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/StorefrontStatus" }

    AppListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AppSummary" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    AppDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AppDetail" }

    VersionListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Version" }

    Role:
      type: string
      enum: [customer, support, catalog_manager, admin]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    ActivationCodeStatus:
      type: string
      enum: [ISSUED, REDEEMED, EXPIRED, REVOKED]

    Permission:
      type: string
      enum: [users.view, users.manage, activation-codes.view, activation-codes.manage, audit.view, catalog.view, catalog.manage, artifacts.view, artifacts.manage, jobs.view, jobs.manage, installations.view, teams.view, teams.manage, devices.view, devices.manage, devices.reveal-udid]

    Subscription:
      type: object
      required: [id, plan, status, starts_at, ends_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        plan: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at:
          description: Null means no end date.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    Me:
      type: object
      required: [id, name, email, roles, subscription, created_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }

    TokenPair:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, user]
      properties:
        token_type: { type: string, enum: [Bearer] }
        access_token: { type: string }
        access_token_expires_at: { $ref: "#/components/schemas/Timestamp" }
        refresh_token: { type: string }
        refresh_token_expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/Me" }

    AdminMe:
      type: object
      required: [id, name, email, roles, permissions]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    AdminLoginStep:
      type: object
      required: [next_step, enrollment]
      properties:
        next_step: { type: string, enum: [totp, totp_enrollment] }
        enrollment:
          description: Present for totp_enrollment only. Show the QR code or secret once; never store it client-side.
          oneOf:
            - type: "null"
            - type: object
              required: [secret, otpauth_uri, qr_svg]
              properties:
                secret: { type: string }
                otpauth_uri: { type: string }
                qr_svg: { type: string }

    AdminUser:
      type: object
      required: [id, name, email, status, roles, totp_enabled, subscription, last_login_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        email: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        totp_enabled: { type: boolean }
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        last_login_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        deletion_requested_at: { type: [string, "null"], description: 'Set when the customer asked for deletion (P8-SEC-02).' }
        erased_at: { type: [string, "null"], description: 'Set when an admin erased the account; personal data has been replaced.' }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [subscriptions, recent_activity]
          properties:
            subscriptions:
              type: array
              items: { $ref: "#/components/schemas/Subscription" }
            recent_activity:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    UserRef:
      type: object
      required: [id, email]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        email: { type: string }

    ActivationCode:
      type: object
      required: [id, batch_id, hint, status, plan, duration_days, expires_at, note, created_by, redeemed_by, redeemed_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        batch_id: { $ref: "#/components/schemas/PublicId" }
        hint:
          type: string
          description: Last four characters of the code.
        status: { $ref: "#/components/schemas/ActivationCodeStatus" }
        plan: { type: string }
        duration_days: { type: [integer, "null"] }
        expires_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        note: { type: [string, "null"] }
        created_by: { $ref: "#/components/schemas/UserRef" }
        redeemed_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        redeemed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }

    ActivationCodeBatch:
      type: object
      required: [batch_id, codes, count]
      properties:
        batch_id: { $ref: "#/components/schemas/PublicId" }
        codes:
          type: array
          items: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$" }
        count: { type: integer, minimum: 1 }

    AuditEntry:
      type: object
      required: [id, occurred_at, actor, action, subject_type, subject_id, before, after, reason, request_id, ip]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        occurred_at: { type: string, description: "UTC with microseconds." }
        actor:
          type: object
          required: [type, id, label]
          properties:
            type: { type: string, enum: [user, system, worker, anonymous] }
            id:
              oneOf:
                - $ref: "#/components/schemas/PublicId"
                - type: "null"
            label: { type: [string, "null"] }
        action: { type: string }
        subject_type: { type: [string, "null"] }
        subject_id: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        reason: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        ip: { type: [string, "null"] }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 10, maxLength: 200, description: "At least one letter and one digit." }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_name: { type: string, maxLength: 100 }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }

    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 32, example: "7K3M-Q9TX-2HWD-8RBN" }

    TotpRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^\\d{6}$" }

    CreateUserRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }

    UpdateUserStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }
        reason: { type: string, maxLength: 500 }

    UpdateRolesRequest:
      type: object
      required: [roles, reason]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        reason: { type: string, maxLength: 500 }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }

    CreateActivationCodesRequest:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 1, maximum: 500 }
        plan: { type: string, maxLength: 32, default: standard }
        duration_days: { type: integer, minimum: 1, maximum: 3650, description: "Omit for no end date." }
        expires_at: { type: string, format: date-time, description: "Last moment the code can be redeemed." }
        note: { type: string, maxLength: 255 }

    EmptyResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { type: "null" }

    DeleteAppResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [purged]
              properties:
                purged:
                  type: object
                  required: [artifacts, signed_builds, bytes]
                  properties:
                    artifacts: { type: integer, minimum: 0 }
                    signed_builds: { type: integer, minimum: 0 }
                    bytes: { type: integer, minimum: 0, description: Disk space freed }

    AcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [accepted]
              properties:
                accepted: { type: boolean, const: true }

    ResetPasswordResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [reset]
              properties:
                reset: { type: boolean, const: true }

    MeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/Me" }

    TokenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/TokenPair" }

    RedeemResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: "#/components/schemas/Subscription" }

    AdminLoginStepResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminLoginStep" }

    AdminMeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminMe" }

    AdminUserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminUser" }

    AdminUserDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminUserDetail" }

    AdminUserListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminUser" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    ActivationCodeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/ActivationCode" }

    ActivationCodeListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ActivationCode" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    ActivationCodeBatchResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/ActivationCodeBatch" }

    AuditLogListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    DeviceRegistrationStatus:
      type: string
      enum: [ENROLLED, APPLE_PENDING, ELIGIBLE, APPLE_FAILED, QUOTA_BLOCKED, NO_ELIGIBLE_TEAM, DISABLED]

    RegistrationSummary:
      type: object
      required: [status, reason, updated_at]
      properties:
        status: { $ref: "#/components/schemas/DeviceRegistrationStatus" }
        reason:
          type: [string, "null"]
          description: 'e.g. APPLE_PROCESSING, APPLE_NOT_CONNECTED, QUOTA_EXHAUSTED, APPLE_UNAVAILABLE.'
        updated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    DeviceSummary:
      type: object
      required: [id, product, family, os_version, udid_hint, enrolled_at, storefront_claimed, registration]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        product: { type: [string, "null"], description: "e.g. iPhone15,2" }
        family: { type: string, enum: [IPHONE, IPAD, IPOD, UNKNOWN] }
        os_version: { type: [string, "null"] }
        udid_hint: { type: string, description: "Masked, e.g. ••••-6F70" }
        enrolled_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        storefront_claimed: { type: boolean }
        registration:
          description: Null while no Apple team is connected.
          oneOf:
            - $ref: "#/components/schemas/RegistrationSummary"
            - type: "null"

    AdminDevice:
      type: object
      required: [id, user, udid_hint, product, family, os_version, enrolled_at, storefront_claimed_at, registration]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        user: { $ref: "#/components/schemas/UserRef" }
        udid_hint: { type: string }
        product: { type: [string, "null"] }
        family: { type: string }
        os_version: { type: [string, "null"] }
        enrolled_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        storefront_claimed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        registration:
          oneOf:
            - $ref: "#/components/schemas/RegistrationSummary"
            - type: "null"

    AdminDeviceDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDevice"
        - type: object
          required: [registrations, history]
          properties:
            registrations:
              type: array
              items:
                type: object
                required: [id, team, status, reason, apple_device_id, attempts, registered_at, eligible_at, updated_at]
                properties:
                  id: { $ref: "#/components/schemas/PublicId" }
                  team: { type: string, description: Apple Team ID }
                  status: { $ref: "#/components/schemas/DeviceRegistrationStatus" }
                  reason: { type: [string, "null"] }
                  apple_device_id: { type: [string, "null"] }
                  attempts: { type: integer, minimum: 0 }
                  registered_at: { type: [string, "null"] }
                  eligible_at: { type: [string, "null"] }
                  updated_at: { type: [string, "null"] }
            history:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    Claim:
      type: object
      required: [code, url, expires_at]
      properties:
        code: { type: string }
        url: { type: string, description: "storefront://claim?code=…" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    ClaimRedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 64 }
        device_name: { type: string, maxLength: 100 }

    DeviceListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DeviceSummary" }

    ClaimResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/Claim" }

    ClaimRedeemResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              allOf:
                - $ref: "#/components/schemas/TokenPair"
                - type: object
                  required: [device]
                  properties:
                    device: { $ref: "#/components/schemas/DeviceSummary" }

    AdminDeviceListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminDevice" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    AdminDeviceDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminDeviceDetail" }

    QueuedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [queued]
              properties:
                queued: { type: boolean }

    RevealUdidResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [udid]
              properties:
                udid: { type: string }

    AppVisibility:
      type: string
      enum: [DRAFT, HIDDEN, PUBLISHED]

    SourceType:
      type: string
      enum: [OWN_BUILD, PARTNER_BUILD, OPEN_SOURCE_BUILD, ALTERNATIVE_MARKETPLACE_PACKAGE, USER_IMPORT, CUSTOMER_PROVIDED]

    AdminApp:
      type: object
      required: [id, slug, name, subtitle, category, publisher, source_type, visibility, age_rating, featured_rank, bundle_identifier, icon_url, is_storefront, latest_version, has_published_artifact, deleted_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        name: { type: string }
        subtitle: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/CategoryRef" }
        publisher: { $ref: "#/components/schemas/PublisherRef" }
        source_type: { $ref: "#/components/schemas/SourceType" }
        visibility: { $ref: "#/components/schemas/AppVisibility" }
        age_rating: { type: string }
        featured_rank: { type: [integer, "null"] }
        bundle_identifier: { type: [string, "null"] }
        icon_url: { type: [string, "null"] }
        is_storefront: { type: boolean }
        latest_version: { type: [string, "null"] }
        has_published_artifact: { type: boolean }
        deleted_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    AdminAppDetail:
      allOf:
        - $ref: "#/components/schemas/AdminApp"
        - type: object
          required: [description, support_url, privacy_url, screenshots, versions]
          properties:
            description: { type: [string, "null"] }
            support_url: { type: [string, "null"] }
            privacy_url: { type: [string, "null"] }
            screenshots:
              type: array
              items: { $ref: "#/components/schemas/AdminScreenshot" }
            versions:
              type: array
              items: { $ref: "#/components/schemas/AdminVersion" }

    AdminScreenshot:
      type: object
      required: [id, url, width, height]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    AdminVersion:
      type: object
      required: [id, version, build_number, min_ios_version, release_notes, released_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        version: { type: string }
        build_number: { type: string }
        min_ios_version: { type: [string, "null"] }
        release_notes: { type: [string, "null"] }
        released_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    AdminCategory:
      type: object
      required: [id, slug, title, subtitle, sort_order, app_count]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        sort_order: { type: integer }
        app_count: { type: integer }

    AdminPublisher:
      type: object
      required: [id, name, website, support_email, app_count]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        name: { type: string }
        website: { type: [string, "null"] }
        support_email: { type: [string, "null"] }
        app_count: { type: integer }

    CreateAppRequest:
      type: object
      required: [name, category_id, publisher_id, source_type]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: [string, "null"], maxLength: 96 }
        subtitle: { type: [string, "null"], maxLength: 120 }
        description: { type: [string, "null"], maxLength: 4000 }
        bundle_identifier:
          type: [string, "null"]
          maxLength: 155
          description: Bundle ID signed builds carry instead of the IPA's (e.g. com.ruappstore.app-name); app extensions get it as their prefix. Null uses the IPA's own ID.
        category_id: { $ref: "#/components/schemas/PublicId" }
        publisher_id: { $ref: "#/components/schemas/PublicId" }
        source_type: { $ref: "#/components/schemas/SourceType" }
        visibility: { $ref: "#/components/schemas/AppVisibility" }
        is_storefront: { type: boolean }
        age_rating: { type: string, enum: ["4+", "9+", "12+", "17+"] }
        featured_rank: { type: [integer, "null"], minimum: 1, maximum: 999 }
        support_url: { type: [string, "null"] }
        privacy_url: { type: [string, "null"] }

    UpdateAppRequest:
      allOf:
        - $ref: "#/components/schemas/CreateAppRequest"
        - type: object
          properties:
            reason: { type: [string, "null"], maxLength: 500 }

    CreateVersionRequest:
      type: object
      required: [version, build_number]
      properties:
        version: { type: string, pattern: "^\\d+(\\.\\d+){0,3}$" }
        build_number: { type: string, maxLength: 32 }
        min_ios_version: { type: [string, "null"] }
        release_notes: { type: [string, "null"], maxLength: 4000 }
        released_at: { type: [string, "null"], format: date-time }

    UpdateVersionRequest:
      type: object
      properties:
        release_notes: { type: [string, "null"], maxLength: 4000 }
        min_ios_version: { type: [string, "null"] }
        released_at: { type: [string, "null"], format: date-time }

    CreateCategoryRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 64 }
        subtitle: { type: [string, "null"], maxLength: 120 }
        slug: { type: [string, "null"], maxLength: 64 }
        sort_order: { type: [integer, "null"], minimum: 0, maximum: 999 }

    UpdateCategoryRequest:
      type: object
      properties:
        title: { type: string, maxLength: 64 }
        subtitle: { type: [string, "null"], maxLength: 120 }
        sort_order: { type: integer, minimum: 0, maximum: 999 }

    CreatePublisherRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        website: { type: [string, "null"] }
        support_email: { type: [string, "null"] }

    UpdatePublisherRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        website: { type: [string, "null"] }
        support_email: { type: [string, "null"] }

    AdminAppListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminApp" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    AdminAppDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminAppDetail" }

    IconResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [icon_url]
              properties:
                icon_url: { type: string }

    ScreenshotResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminScreenshot" }

    ScreenshotListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminScreenshot" }

    VersionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminVersion" }

    AdminCategoryResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminCategory" }

    AdminCategoryListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminCategory" }

    AdminPublisherResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminPublisher" }

    AdminPublisherListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminPublisher" }

    CreateUploadRequest:
      type: object
      required: [app_id, filename, size_bytes, source_type, declaration_version, declaration_accepted]
      properties:
        app_id: { $ref: "#/components/schemas/PublicId" }
        app_version_id:
          oneOf:
            - $ref: "#/components/schemas/PublicId"
            - type: "null"
        filename: { type: string, pattern: '\.[iI][pP][aA]$' }
        size_bytes: { type: integer, minimum: 1, maximum: 5368709120 }
        sha256:
          type: [string, "null"]
          pattern: '^[a-fA-F0-9]{64}$'
        source_type: { $ref: "#/components/schemas/SourceType" }
        declaration_version: { type: string, maxLength: 32 }
        declaration_accepted: { type: boolean, const: true }

    UploadSession:
      type: object
      required: [id, status, filename, size_bytes, chunk_size, chunk_count, received_chunks, missing_chunks, expires_at, artifact_id]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        status: { type: string, enum: [OPEN, ASSEMBLING, COMPLETED, FAILED] }
        filename: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        chunk_size: { type: integer, const: 8388608 }
        chunk_count: { type: integer, minimum: 1 }
        received_chunks:
          type: array
          items: { type: integer, minimum: 0 }
        missing_chunks:
          type: array
          items: { type: integer, minimum: 0 }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        artifact_id:
          oneOf:
            - $ref: "#/components/schemas/PublicId"
            - type: "null"

    UploadSessionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/UploadSession" }

    UploadChunk:
      type: object
      required: [number, size_bytes, sha256, already_received]
      properties:
        number: { type: integer, minimum: 0 }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        already_received: { type: boolean }

    UploadChunkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/UploadChunk" }

    UploadedArtifact:
      type: object
      required: [id, status, job_id, sha256, size_bytes, original_filename]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        job_id:
          description: 'Pipeline job that hashes and inspects the artifact (InspectArtifactJob). Poll it for progress.'
          oneOf:
            - $ref: "#/components/schemas/PublicId"
            - type: 'null'
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1 }
        original_filename: { type: string }

    ArtifactStatus:
      type: string
      description: |
        Source artifact lifecycle (IMPLEMENTATION_PLAN §5.1). Usually UPLOADED right after upload; inspection
        runs in the queue and moves it to PROVENANCE_REVIEW, or to INSPECTION_FAILED / REJECTED / QUARANTINED
        with a machine-readable status_reason (e.g. ENCRYPTED_BINARY, VERSION_EXISTS, UNSAFE_PATH).
      enum: [UPLOADED, HASHING, INSPECTING, PROVENANCE_REVIEW, COMPATIBILITY_CHECK, READY, PUBLISHED, REJECTED,
        INSPECTION_FAILED, PROVENANCE_FAILED, QUARANTINED, REVOKED, EXPIRED]

    AdminArtifact:
      type: object
      required: [id, app, status, status_reason, original_filename, size_bytes, sha256, source_type, bundle_identifier,
        version, build_number, min_ios_version, compatibility_issues, malware_scan, uploaded_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        app:
          oneOf:
            - type: object
              required: [id, name, source_type]
              properties:
                id: { $ref: "#/components/schemas/PublicId" }
                name: { type: string }
                source_type: { type: string }
            - type: "null"
        status: { $ref: "#/components/schemas/ArtifactStatus" }
        status_reason: { type: [string, "null"], description: 'Machine-readable reason, e.g. ENCRYPTED_BINARY, ARM64_MISSING, SUPERSEDED.' }
        original_filename: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        source_type: { type: string }
        bundle_identifier: { type: [string, "null"] }
        version: { type: [string, "null"] }
        build_number: { type: [string, "null"] }
        min_ios_version: { type: [string, "null"] }
        compatibility_issues: { type: array, items: { type: string } }
        malware_scan: { type: [string, "null"], enum: [CLEAN, INFECTED, SCAN_UNAVAILABLE, null] }
        uploaded_by: { type: [string, "null"] }
        created_at: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }

    AdminArtifactDetail:
      allOf:
        - $ref: "#/components/schemas/AdminArtifact"
        - type: object
          required: [declaration, app_version_id, inspection, reviews, documents, jobs, available_actions, review_checklist, history]
          properties:
            declaration:
              type: object
              required: [version, accepted_at]
              properties:
                version: { type: string }
                accepted_at: { type: [string, "null"] }
            app_version_id:
              oneOf:
                - $ref: "#/components/schemas/PublicId"
                - type: "null"
            inspection:
              type: [object, "null"]
              description: 'Full inspection report: archive, bundle, binaries, nested_bundles, entitlements, embedded_profile, malware_scan, compatibility_issues, failure, compatibility.'
            reviews:
              type: array
              items:
                type: object
                required: [id, decision, from_status, to_status, reason, checklist, scan_result_acknowledged, reviewer, created_at]
                properties:
                  id: { $ref: "#/components/schemas/PublicId" }
                  decision: { type: string, enum: [APPROVED, REJECTED, RELEASED] }
                  from_status: { $ref: "#/components/schemas/ArtifactStatus" }
                  to_status: { $ref: "#/components/schemas/ArtifactStatus" }
                  reason: { type: [string, "null"] }
                  checklist: { type: [object, "null"], additionalProperties: { type: boolean } }
                  scan_result_acknowledged: { type: boolean }
                  reviewer: { type: [string, "null"] }
                  created_at: { type: string }
            documents:
              type: array
              items: { $ref: "#/components/schemas/ProvenanceDocument" }
            jobs:
              type: array
              items: { $ref: "#/components/schemas/AdminJob" }
            available_actions:
              type: array
              items: { type: string, enum: [approve, reject, release, publish, revoke, inspect] }
            review_checklist:
              type: object
              required: [version, items]
              properties:
                version: { type: string }
                items: { type: array, items: { type: string } }
            history:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }

    AdminArtifactListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminArtifact" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    AdminArtifactResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminArtifact" }

    AdminArtifactDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminArtifactDetail" }

    AdminArtifactReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [review_id, decision, artifact]
              properties:
                review_id: { $ref: "#/components/schemas/PublicId" }
                decision: { type: string, enum: [APPROVED, REJECTED, RELEASED] }
                artifact: { $ref: "#/components/schemas/AdminArtifact" }

    AdminArtifactReinspectResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [artifact, job]
              properties:
                artifact: { $ref: "#/components/schemas/AdminArtifact" }
                job: { $ref: "#/components/schemas/AdminJob" }

    ProvenanceDocument:
      type: object
      required: [id, filename, mime_type, size_bytes, sha256, description, download_url, created_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        description: { type: [string, "null"] }
        download_url: { type: string }
        created_at: { type: string }

    ProvenanceDocumentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/ProvenanceDocument" }

    PipelineJobStatus:
      type: string
      enum: [QUEUED, LEASED, RUNNING, SUCCEEDED, FAILED_RETRYABLE, FAILED_PERMANENT, CANCELLED]

    AdminJob:
      type: object
      required: [id, type, status, attempt, max_attempts, subject, correlation_id, result_code, error_class, error_message,
        started_at, finished_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        type: { type: string, examples: [InspectArtifactJob] }
        status: { $ref: "#/components/schemas/PipelineJobStatus" }
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        subject:
          oneOf:
            - type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [artifact] }
                id: { $ref: "#/components/schemas/PublicId" }
            - type: "null"
        correlation_id: { type: string }
        result_code: { type: [string, "null"] }
        error_class: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        created_at: { type: [string, "null"] }

    AdminJobListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminJob" }
            meta:
              allOf:
                - $ref: "#/components/schemas/Meta"
                - required: [pagination]

    AdminJobResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AdminJob" }

    AdminJobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AdminJob"
                - type: object
                  required: [payload, attempts]
                  properties:
                    payload: { type: [object, "null"] }
                    attempts:
                      type: array
                      items:
                        type: object
                        required: [attempt, worker, started_at, finished_at, result_code, error_class, error_message]
                        properties:
                          attempt: { type: integer, minimum: 1 }
                          worker: { type: [string, "null"] }
                          started_at: { type: [string, "null"] }
                          finished_at: { type: [string, "null"] }
                          result_code: { type: [string, "null"] }
                          error_class: { type: [string, "null"] }
                          error_message: { type: [string, "null"] }

    Installation:
      type: object
      required: [id, status, status_reason, app, version, build_number, preparation, delivered_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        status: { type: string, enum: [PREPARING, READY_TO_INSTALL, AUTHORIZED, MANIFEST_FETCHED, DELIVERED, FAILED, EXPIRED] }
        status_reason: { type: [string, "null"], description: 'e.g. NO_SIGNING_CERTIFICATE, DEVICE_NOT_IN_PROFILE, ARTIFACT_REVOKED, SUPERSEDED' }
        app:
          type: object
          required: [id, name, icon_url]
          properties:
            id: { $ref: "#/components/schemas/PublicId" }
            name: { type: string }
            icon_url: { type: [string, "null"] }
        version: { type: [string, "null"] }
        build_number: { type: [string, "null"] }
        preparation:
          type: object
          required: [stage, progress]
          properties:
            stage: { type: [string, "null"], enum: [SIGNING_PENDING, SIGNING, SIGNED, SIGNATURE_VERIFIED, DELIVERABLE, SIGNING_FAILED, VALIDATION_FAILED, EXPIRED, REVOKED, null] }
            progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        delivered_at: { type: [string, "null"] }
        created_at: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }

    InstallationResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/Installation" }

    LibraryResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Installation" }

    InstallLinkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: object
              required: [installation_id, install_url, manifest_url, expires_at]
              properties:
                installation_id: { $ref: "#/components/schemas/PublicId" }
                install_url: { type: string, pattern: '^itms-services://\?action=download-manifest&url=' }
                manifest_url: { type: string }
                expires_at: { type: string }

    AppleTeam:
      type: object
      required: [id, apple_team_id, name, status, is_primary, storefront_app_id, storefront_bundle_id, membership_expires_at, last_verified_at, credential, membership_year, quotas, eligibilities, certificates, profiles]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        apple_team_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, EXPIRING, SUSPENDED, REVOKED, DISCONNECTED] }
        is_primary: { type: boolean }
        storefront_app_id: { type: [string, "null"] }
        storefront_bundle_id: { type: [string, "null"] }
        membership_expires_at: { type: [string, "null"] }
        last_verified_at: { type: [string, "null"] }
        credential:
          type: [object, "null"]
          properties:
            key_id: { type: string }
            issuer_id: { type: string }
            last_verified_at: { type: [string, "null"] }
        membership_year:
          type: [object, "null"]
          properties:
            starts_at: { type: string }
            ends_at: { type: string }
        quotas:
          type: array
          items:
            type: object
            required: [family, limit, registered, reserved, remaining, apple_registered, last_synced_at]
            properties:
              family: { type: string, enum: [IPHONE, IPAD, IPOD, UNKNOWN] }
              limit: { type: integer }
              registered: { type: integer }
              reserved: { type: integer }
              remaining: { type: integer, minimum: 0 }
              apple_registered: { type: [integer, "null"] }
              last_synced_at: { type: [string, "null"] }
        eligibilities: { type: array, items: { type: string } }
        certificates:
          type: array
          items:
            type: object
            properties:
              sha1: { type: string }
              common_name: { type: string }
              status: { type: string }
              expires_at: { type: [string, "null"] }
              on_runner: { type: boolean }
        profiles:
          type: object
          properties:
            active: { type: integer }
            expiring_soon: { type: integer }

    AppleTeamResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/AppleTeam" }

    AppleTeamListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AppleTeam" }

    UploadedArtifactResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - properties:
            data: { $ref: "#/components/schemas/UploadedArtifact" }
